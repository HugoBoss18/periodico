<!-- templates/articulos/editar.html -->
{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block titulo %}Editar artículo{% endblock titulo %}

{% block contenido %}
  <h1 class="h3 mb-3">Editar artículo</h1>
  <form action="" method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Guardar cambios</button>
    <a class="btn btn-outline-secondary" href="{{ articulo.get_absolute_url }}">Cancelar</a>
  </form>
{% endblock contenido %}
